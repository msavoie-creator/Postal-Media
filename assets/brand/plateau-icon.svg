<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Plateau — slate mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Plateau — slate mark (1a)</title>
  <defs>
    <linearGradient id="pl-field" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#F5CE63"></stop>
      <stop offset="0.44" stop-color="#E0AC2E"></stop>
      <stop offset="1" stop-color="#B57F17"></stop>
    </linearGradient>
    <linearGradient id="pl-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC"></stop>
      <stop offset="1" stop-color="#EFDEBC"></stop>
    </linearGradient>
    <linearGradient id="pl-stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2320"></stop>
      <stop offset="1" stop-color="#100C0A"></stop>
    </linearGradient>
    <linearGradient id="pl-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>

    <clipPath id="pl-tile">
      <rect x="0" y="0" width="1024" height="1024" rx="230.4" ry="230.4"></rect>
    </clipPath>
    <clipPath id="pl-stickclip">
      <rect x="0" y="0" width="798.72" height="168.96" rx="30.72" ry="30.72"></rect>
    </clipPath>

    <pattern id="pl-teeth" width="114.69" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <rect x="0" y="0" width="53.25" height="200" fill="#FFF6E2"></rect>
    </pattern>

    <filter id="pl-drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="23" flood-color="#281A04" flood-opacity="0.42"></feDropShadow>
    </filter>
  </defs>

  <g clip-path="url(#pl-tile)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#pl-field)"></rect>

    
    <rect x="133.12" y="450.56" width="757.76" height="409.6" rx="35.84" ry="35.84" fill="url(#pl-face)"></rect>
    <rect x="204.8" y="573.44" width="512" height="46.08" rx="20.48" ry="20.48" fill="#8C6415" opacity="0.85"></rect>
    <rect x="204.8" y="675.84" width="327.68" height="46.08" rx="20.48" ry="20.48" fill="#8C6415" opacity="0.55"></rect>

    
    <g filter="url(#pl-drop)">
      <g transform="translate(112.64 240.64) rotate(-10)">
        <g clip-path="url(#pl-stickclip)">
          <rect x="0" y="0" width="798.72" height="168.96" fill="url(#pl-stick)"></rect>
          <rect x="-200" y="-40" width="1200" height="260" fill="url(#pl-teeth)"></rect>
          <rect x="0" y="0" width="798.72" height="14" fill="#FFFFFF" opacity="0.14"></rect>
        </g>
      </g>
    </g>

    
    <rect x="0" y="0" width="1024" height="24" fill="url(#pl-gloss)"></rect>
  </g>
</svg>